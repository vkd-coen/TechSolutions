<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — TechPro Solutions</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<main class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <a href="/" class="logo">
        <span class="logo-primary">TechPro</span>
        <span class="logo-secondary">Solutions</span>
      </a>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-target="login-form">Sign In</button>
      <button class="auth-tab"        data-target="register-form">Create Account</button>
    </div>

    <!-- ── Sign In ── -->
    <form id="login-form" class="auth-form active" novalidate>
      <div id="login-alert"></div>

      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input class="form-control" id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input class="form-control" id="login-password" type="password" autocomplete="current-password" placeholder="Your password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">Sign In</button>

      <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--gray-500)">
        Don't have an account?
        <button type="button" class="auth-tab" data-target="register-form" style="background:none;border:none;color:var(--blue);font-weight:700;cursor:pointer;padding:0">Create one</button>
      </p>
    </form>

    <!-- ── Create Account ── -->
    <form id="register-form" class="auth-form" novalidate>
      <div id="register-alert"></div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-first">First Name</label>
          <input class="form-control" id="reg-first" type="text" autocomplete="given-name" placeholder="John" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-last">Last Name</label>
          <input class="form-control" id="reg-last" type="text" autocomplete="family-name" placeholder="Doe" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input class="form-control" id="reg-email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <input class="form-control" id="reg-password" type="password" autocomplete="new-password" placeholder="Create a strong password" required />

        <!-- Strength bar -->
        <div class="pw-strength-bar">
          <div class="pw-strength-fill" id="pw-fill"></div>
        </div>

        <!-- Requirements checklist -->
        <div class="pw-requirements">
          <span class="pw-req unmet" id="req-length"><span class="req-icon"></span>8+ characters</span>
          <span class="pw-req unmet" id="req-upper"><span class="req-icon"></span>Uppercase letter</span>
          <span class="pw-req unmet" id="req-lower"><span class="req-icon"></span>Lowercase letter</span>
          <span class="pw-req unmet" id="req-number"><span class="req-icon"></span>Number</span>
          <span class="pw-req unmet" id="req-special"><span class="req-icon"></span>Special character</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm">Confirm Password</label>
        <input class="form-control" id="reg-confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">Create Account</button>

      <p style="text-align:center;margin-top:1rem;font-size:.78rem;color:var(--gray-500)">
        By creating an account you agree to our <a href="#" style="color:var(--blue)">Terms of Service</a>.
      </p>
    </form>

  </div>
</main>

<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
